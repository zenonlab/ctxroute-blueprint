name: Validate Tobirink Worker

on:
  push:
    branches: [main]
    paths:
      - apps/worker/**
      - packages/adapters-cloudflare/**
      - packages/application/**
      - packages/contracts/**
      - package.json
      - package-lock.json
      - .github/workflows/cloudflare.yml
  pull_request:
    branches: [main]
    paths:
      - apps/worker/**
      - packages/adapters-cloudflare/**
      - packages/application/**
      - packages/contracts/**
      - package.json
      - package-lock.json
      - .github/workflows/cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Worker contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Type-check Worker boundary
        run: npm run typecheck --workspace @tobirink/worker

      - name: Test Worker routes
        run: npm run test:worker

      - name: Test D1 contracts and migrations
        run: npm run test:d1

      - name: Test media contracts
        run: npm run test:media

      - name: Test agenda snapshots
        run: npm run test:agenda

      - name: Test Worker security boundary
        run: npm run test:security --workspace @tobirink/worker
