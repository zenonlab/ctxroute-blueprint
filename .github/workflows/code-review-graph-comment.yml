name: code-review-graph comment

on:
  workflow_run:
    workflows: [code-review-graph]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Locate exactly one bounded report artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ARCHIVE_BYTES: "100000"
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mapfile -t rows < <(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            -f per_page=100 --jq '.artifacts[] | select(.name == "crg-report" and (.expired | not)) | [.id, .size_in_bytes] | @tsv')
          if [ "${#rows[@]}" -ne 1 ]; then
            echo "Expected exactly one non-expired crg-report artifact." >&2
            exit 1
          fi
          IFS=$'\t' read -r artifact_id artifact_size <<< "${rows[0]}"
          [[ "${artifact_id}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${artifact_size}" =~ ^[0-9]+$ ]] || exit 1
          if [ "${artifact_size}" -eq 0 ] || [ "${artifact_size}" -gt "${MAX_ARCHIVE_BYTES}" ]; then exit 1; fi
          printf 'artifact-id=%s\n' "${artifact_id}" >> "${GITHUB_OUTPUT}"

      - name: Download into runner temp without checking out PR code
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/crg-report-download
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and neutralize the untrusted report
        env:
          COMMENT_BODY: ${{ runner.temp }}/crg-comment-body.md
          DOWNLOAD_DIR: ${{ runner.temp }}/crg-report-download
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          MAX_BODY_BYTES: "65000"
          MAX_REPORT_BYTES: "60000"
          VALIDATED_PR_NUMBER: ${{ runner.temp }}/crg-pr-number.txt
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["DOWNLOAD_DIR"])
          if not root.is_dir() or root.is_symlink():
              raise SystemExit("Unsafe artifact root")
          entries = {path.name: path for path in root.iterdir()}
          expected = {"crg-comment.md", "pr-number.txt", "head-sha.txt"}
          if set(entries) != expected or any(path.is_symlink() or not path.is_file() for path in entries.values()):
              raise SystemExit("Artifact must contain exactly three regular files")

          pr_bytes = entries["pr-number.txt"].read_bytes()
          if len(pr_bytes) > 12:
              raise SystemExit("PR number is too large")
          try:
              pr_text = pr_bytes.decode("ascii")
          except UnicodeDecodeError as exc:
              raise SystemExit("PR number must be ASCII") from exc
          if re.fullmatch(r"[1-9][0-9]{0,9}\n?", pr_text) is None:
              raise SystemExit("Invalid PR number")

          sha_bytes = entries["head-sha.txt"].read_bytes()
          if len(sha_bytes) > 41:
              raise SystemExit("SHA is too large")
          try:
              analyzed_sha = sha_bytes.decode("ascii").strip()
          except UnicodeDecodeError as exc:
              raise SystemExit("SHA must be ASCII") from exc
          if re.fullmatch(r"[0-9a-f]{40}", analyzed_sha) is None or analyzed_sha != os.environ["EXPECTED_SHA"]:
              raise SystemExit("Analyzed SHA does not match the workflow run")

          report = entries["crg-comment.md"]
          if report.stat().st_size == 0 or report.stat().st_size > int(os.environ["MAX_REPORT_BYTES"]):
              raise SystemExit("Report is empty or too large")
          try:
              text = report.read_bytes().decode("utf-8")
          except UnicodeDecodeError as exc:
              raise SystemExit("Report must be UTF-8") from exc
          if any(ord(char) < 32 and char not in "\n\r\t" for char in text) or "\x7f" in text:
              raise SystemExit("Report contains control characters")
          marker = "<!-- code-review-graph-report -->"
          text = text.replace(marker, "").replace("\r\n", "\n").replace("\r", "\n").lstrip("\n")
          if not text.startswith("## code-review-graph review\n") or "*Powered by [code-review-graph]" not in text:
              raise SystemExit("Unexpected CRG report format")
          body = f"{marker}\n\n{text.replace('@', '&#64;')}"
          if len(body.encode("utf-8")) > int(os.environ["MAX_BODY_BYTES"]):
              raise SystemExit("Comment body is too large")
          Path(os.environ["COMMENT_BODY"]).write_text(body, encoding="utf-8")
          Path(os.environ["VALIDATED_PR_NUMBER"]).write_text(str(int(pr_text)), encoding="ascii")
          PY

      - name: Upsert the trusted sticky comment
        env:
          COMMENT_BODY: ${{ runner.temp }}/crg-comment-body.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER_FILE: ${{ runner.temp }}/crg-pr-number.txt
        run: |
          set -euo pipefail
          pr_number=$(cat "${PR_NUMBER_FILE}")
          actual_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')
          [ "${actual_sha}" = "${HEAD_SHA}" ] || { echo "PR head changed; refusing stale comment." >&2; exit 1; }
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- code-review-graph-report -->"))) | .id' | sed -n '1p')
          if [ -n "${comment_id}" ]; then
            gh api --method PATCH --silent "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@"${COMMENT_BODY}"
          else
            gh api --method POST --silent "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" -F body=@"${COMMENT_BODY}"
          fi
