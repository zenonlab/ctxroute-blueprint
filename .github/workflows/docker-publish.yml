name: Validate and package Tobirink extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Chrome and Firefox packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Type-check product workspaces
        run: npm run typecheck

      - name: Test domain and application contracts
        run: |
          npm run test:domain
          npm run test:contracts

      - name: Test extension surfaces
        run: |
          npm run test:ui
          npm run test:ui-workbench
          npm run test:a11y
          npm run test:security

      - name: Build deterministic browser packages
        run: npm run package:extension

      - name: Upload unsigned release candidates
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: tobirink-extension-${{ github.sha }}
          path: apps/extension/.output/packages/
          if-no-files-found: error
          retention-days: 14
