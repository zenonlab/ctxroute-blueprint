name: Validate and publish FavLib images
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: read, packages: write, id-token: write }

jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env: { POSTGRES_DB: favlib_test, POSTGRES_USER: favlib, POSTGRES_PASSWORD: favlib_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U favlib -d favlib_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://favlib:favlib_test@127.0.0.1:5432/favlib_test
      FAVLIB_BASE_URL: https://favlib.home.arpa
      CATALOG_FINGERPRINT_KEY: ci-only-synthetic-fingerprint-key-32-bytes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Configuration guard
        run: pnpm verify:central-config && pnpm verify:image-safety
      - name: Idempotent migrations
        run: pnpm db:migrate
      - name: Static and unit gates
        run: pnpm lint && pnpm typecheck && pnpm test
      - name: PostgreSQL API and worker integrations
        run: pnpm --filter @favlib/api test:integration && pnpm --filter @favlib/worker test:integration && pnpm --filter @favlib/api test:e2e
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Global build
        run: pnpm build && pnpm --filter @favlib/worker build
      - name: Install Playwright browsers
        run: pnpm --filter @favlib/web exec playwright install --with-deps chromium firefox webkit
      - name: Browser gates
        run: pnpm test:e2e

  publish:
    needs: validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
          - component: worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository_owner }}/favlib-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          sbom: true
          provenance: mode=max
