name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify-and-deploy-worker:
    # GitHub-hosted Linux runners are unavailable for this repository. Keep the
    # production lane on the explicitly registered, online runner only.
    runs-on: [self-hosted, macOS, ARM64, cloudflare-ci]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH"
          uv python install 3.12
          PYTHON_BIN="$(uv python find 3.12)"
          echo "$(dirname "$PYTHON_BIN")" >> "$GITHUB_PATH"
          "$PYTHON_BIN" --version

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Restore pinned Archify tooling
        run: node .githooks/archify restore

      - name: Verify repository
        run: npm run verify

      - name: Create expiring Cloudflare plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run infra:plan -- \
            --provider cloudflare \
            --account "$CLOUDFLARE_ACCOUNT_ID" \
            --operation worker-deploy > .ctxroute-production-plan.json
          node -e "const fs=require('node:fs'); const plan=JSON.parse(fs.readFileSync('.ctxroute-production-plan.json','utf8')); if (!plan.digest || !Array.isArray(plan.actions) || plan.actions.length !== 1 || plan.actions[0].target !== 'worker:tobirink-public-api') process.exit(1);"

      - name: Apply only the approved Worker target
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PLAN_DIGEST="$(node -e "const fs=require('node:fs'); process.stdout.write(JSON.parse(fs.readFileSync('.ctxroute-production-plan.json','utf8')).digest)")"
          npm run infra:apply -- \
            --provider cloudflare \
            --plan .ctxroute-production-plan.json \
            --approve "$PLAN_DIGEST" \
            --account "$CLOUDFLARE_ACCOUNT_ID" \
            --allow worker:tobirink-public-api
