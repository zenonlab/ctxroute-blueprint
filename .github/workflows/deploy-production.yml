name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_manga_canary:
        description: 'Exécuter deux nouvelles demandes canari anime et manga après le déploiement (sans réarmement historique)'
        required: false
        default: false
        type: boolean
      publish_extension:
        description: 'Publier les deux archives candidates immuables après les canaris (sans avancer le pointeur Web)'
        required: false
        default: false
        type: boolean
      certified_release_tag:
        description: 'Tag du brouillon contenant le XPI certifié et publication-manifest.json pour ce commit'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify-and-deploy-worker:
    # GitHub-hosted Linux runners are unavailable for this repository. Keep the
    # production lane on the explicitly registered, online runner only.
    runs-on: [self-hosted, macOS, ARM64, cloudflare-ci]
    environment: production
    env:
      TOBIRINK_PUBLISH_EXTENSION: ${{ inputs.publish_extension }}
      TOBIRINK_RUN_MANGA_CANARY: ${{ inputs.run_manga_canary }}
      TOBIRINK_CERTIFIED_RELEASE_TAG: ${{ inputs.certified_release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH"
          printf '%s\n' "$HOME/.local/bin" "/opt/homebrew/bin" >> "$GITHUB_PATH"
          uv python install 3.12.0
          PYTHON_BIN="$(uv python find 3.12.0)"
          echo "$(dirname "$PYTHON_BIN")" >> "$GITHUB_PATH"
          "$PYTHON_BIN" --version
          UV_PYTHON="$PYTHON_BIN" \
            UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/packages/code-review-graph/.venv" \
            uv run --project "$GITHUB_WORKSPACE/packages/code-review-graph" --frozen code-review-graph --version

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply locked runtime patches
        run: npx patch-package --error-on-fail

      - name: Check extension publication preconditions
        run: node --input-type=module -e "import { assertExtensionPublicationContext } from './scripts/infra/cloudflare-driver.mjs'; assertExtensionPublicationContext();"

      - name: Prepare extension generated types
        run: npm run postinstall --workspace @tobirink/extension

      - name: Restore pinned Archify tooling
        run: node .githooks/archify restore

      - name: Build public web application
        run: npm run build --workspace @tobirink/web

      - name: Package release candidate
        run: npm run package:extension

      - name: Verify isolated extension builds
        run: node scripts/release/package-extension.mjs --verify-isolated

      - name: Install Playwright Chromium
        run: |
          npm run setup:browser --workspace @tobirink/web
          CHROME_BIN="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          test -x "$CHROME_BIN"
          printf 'CHROME_BIN=%s\n' "$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Run browser E2E suite
        run: npm run test:e2e --workspace @tobirink/web -- --workers=1

      - name: Verify repository
        run: npm run verify

      - name: Require sealed publication artifacts before production effects
        if: ${{ inputs.publish_extension == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(gh release view "$TOBIRINK_CERTIFIED_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          EXTENSION_VERSION="$(node -p "require('./apps/extension/package.json').version")"
          gh release download "$TOBIRINK_CERTIFIED_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'publication-manifest.json' \
            --pattern "tobirink-firefox-mv3-$EXTENSION_VERSION.xpi" \
            --dir apps/extension/.output/packages
          node --input-type=module -e "import { readExtensionPublicationCandidate } from './scripts/infra/cloudflare-driver.mjs'; await readExtensionPublicationCandidate();"

      - name: Verify Cloudflare CI token
        timeout-minutes: 1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/infra/public-discovery-diagnostics.mjs --verify-token

      - name: Collect aggregate Discovery diagnostics
        timeout-minutes: 2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/infra/public-discovery-diagnostics.mjs

      - name: Create expiring Cloudflare plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent infra:plan -- \
            --provider cloudflare \
            --account "$CLOUDFLARE_ACCOUNT_ID" \
            --operation d1-migrate:PUBLIC_DB \
            --operation r2-bucket-ensure:tobirink-discovery-audit \
            --operation r2-lifecycle-set:tobirink-discovery-audit \
            --operation worker-deploy \
            --preserve-routes true > .ctxroute-production-plan.json
          node -e "const fs=require('node:fs'); const plan=JSON.parse(fs.readFileSync('.ctxroute-production-plan.json','utf8')); const expected=new Set(['d1-migrate:d1:tobirink-public','r2-bucket-ensure:r2-bucket:tobirink-discovery-audit','r2-lifecycle-set:r2-lifecycle:tobirink-discovery-audit/provider-audit/v1/7d','worker-deploy:worker:tobirink-public-api']); const actual=new Set((plan.actions??[]).map(({kind,target})=>kind+':'+target)); if (!plan.digest || actual.size !== expected.size || [...expected].some(action=>!actual.has(action)) || plan.options?.preserveRoutes !== true) process.exit(1);"

      - name: Apply only the approved Worker target
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PLAN_DIGEST="$(node -e "const fs=require('node:fs'); process.stdout.write(JSON.parse(fs.readFileSync('.ctxroute-production-plan.json','utf8')).digest)")"
          npm run --silent infra:apply -- \
            --provider cloudflare \
            --plan .ctxroute-production-plan.json \
            --approve "$PLAN_DIGEST" \
            --account "$CLOUDFLARE_ACCOUNT_ID" \
            --allow d1:tobirink-public \
            --allow r2-bucket:tobirink-discovery-audit \
            --allow r2-lifecycle:tobirink-discovery-audit/provider-audit/v1/7d \
            --allow worker:tobirink-public-api

      - name: Verify public production probes
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local url="$1"
            local headers_file
            headers_file="$(mktemp)"
            trap 'rm -f "$headers_file"' RETURN
            local status
            status="$(curl --fail --silent --show-error --location --dump-header "$headers_file" --output /dev/null --write-out '%{http_code}' "$url")"
            test "$status" = 200
            local trace_id cache_control
            trace_id="$(awk 'BEGIN{IGNORECASE=1} /^x-(tobirink-)?(request|trace)-id:/ {sub(/^[^:]*:[[:space:]]*/, ""); print; exit}' "$headers_file" | tr -d '\r')"
            cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]*:[[:space:]]*/, ""); print; exit}' "$headers_file" | tr -d '\r')"
            printf '%s status=%s trace_id=%s cache_control=%s\n' "$url" "$status" "${trace_id:-unavailable}" "${cache_control:-unavailable}"
          }
          probe https://tobirink.com/
          probe https://tobirink.com/library
          probe https://tobirink.com/download
          probe https://tobirink-provider-gateway.tobirink.deno.net/healthz

      - name: Run fresh bounded anime and manga canaries
        if: ${{ github.ref == 'refs/heads/main' && inputs.run_manga_canary == true }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/infra/manga-canary.mjs --observe

      - name: Publish and verify immutable extension archives
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_extension == true && inputs.run_manga_canary == true }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          EXTENSION_VERSION="$(node --input-type=module -e "import { assertExtensionPublicationContext, readExtensionPublicationCandidate } from './scripts/infra/cloudflare-driver.mjs'; if (!assertExtensionPublicationContext()) process.exit(1); process.stdout.write((await readExtensionPublicationCandidate()).version);")"
          npm run --silent infra:plan -- \
            --provider cloudflare \
            --account "$CLOUDFLARE_ACCOUNT_ID" \
            --operation r2-publish:tobirink-chrome-mv3-"$EXTENSION_VERSION".zip \
            --operation r2-publish:tobirink-firefox-mv3-"$EXTENSION_VERSION".xpi > .ctxroute-extension-publication-plan.json
          EXTENSION_PLAN_DIGEST="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; import { assertExtensionPublicationPlan, readExtensionPublicationCandidate } from './scripts/infra/cloudflare-driver.mjs'; const plan = JSON.parse(await readFile('.ctxroute-extension-publication-plan.json', 'utf8')); assertExtensionPublicationPlan(plan, await readExtensionPublicationCandidate(), process.env.CLOUDFLARE_ACCOUNT_ID); process.stdout.write(plan.digest);")"
          npm run --silent infra:apply -- \
            --provider cloudflare \
            --plan .ctxroute-extension-publication-plan.json \
            --approve "$EXTENSION_PLAN_DIGEST" \
            --account "$CLOUDFLARE_ACCOUNT_ID" \
            --allow r2:tobirink-public-releases/downloads/tobirink-chrome-mv3-"$EXTENSION_VERSION".zip \
            --allow r2:tobirink-public-releases/downloads/tobirink-firefox-mv3-"$EXTENSION_VERSION".xpi
          node --input-type=module -e "import { readExtensionPublicationCandidate, verifyExtensionPublication } from './scripts/infra/cloudflare-driver.mjs'; console.log(JSON.stringify(await verifyExtensionPublication(await readExtensionPublicationCandidate())));"

      - name: Remove temporary deployment plan
        if: ${{ always() }}
        shell: bash
        run: rm -f .ctxroute-production-plan.json .ctxroute-extension-publication-plan.json
