name: Publish public Agenda generation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-public-generation
  cancel-in-progress: false

jobs:
  verify-public-export:
    name: Verify the standalone public collectors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify the exportable package
        run: npm run verify --workspace @tobirink/public-discovery
