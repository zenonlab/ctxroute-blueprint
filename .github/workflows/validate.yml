name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: blueprint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Check installation prerequisites
        run: npm run setup:check

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate project configuration
        run: npm run validate:config

      - name: Validate CTXRoute wiring
        run: npm run validate:ctxroute

      - name: Validate Archify architecture
        run: npm run validate:architecture

      - name: Validate documentation and UI contracts
        run: npm run validate:docs -- --all && npm run validate:ui

      - name: Validate Sensor coverage
        run: npm run sensor -- --checklist --json --sarif > sensor.sarif

      - name: Validate governance and workspace
        run: npm run workspace:check && npm run governance:check && npm run check:coherence

      - name: Run tests
        run: npm test

      - name: Run dependency audit
        run: npm audit --audit-level=high

      - name: Check POSIX hook syntax
        if: runner.os != 'Windows'
        run: sh -n .githooks/pre-commit .githooks/pre-push .githooks/commit-msg

      - name: Build Archify documentation
        run: npm run build:docs

      - name: Write validation summary
        run: npm run ci:summary

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: blueprint-validation-${{ runner.os }}
          path: |
            dist/
            sensor.sarif
            ci-summary.md
          if-no-files-found: warn

  smoke-install:
    name: Clean installation smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Verify clean install and idempotent checks
        run: npm ci && npm run setup:check && npm run validate
