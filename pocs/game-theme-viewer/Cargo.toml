[package]
name = "game-theme-viewer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0"
bevy = { version = "0.19.1", default-features = false, features = [
  "3d_bevy_render",
  "bevy_winit",
  "default_app",
  "multi_threaded",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.21"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
