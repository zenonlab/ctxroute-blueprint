<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FavLib</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0b0e;--surface:#15151a;--surface2:#1d1d24;--line:#303039;--text:#f2f2f4;--muted:#96969f;--accent:#ffb52e;--good:#70d6a1;--danger:#f38b8b}*{box-sizing:border-box}html,body{margin:0;width:360px;height:540px;overflow:hidden;background:var(--bg);color:var(--text);font:13px Inter,ui-sans-serif,system-ui,sans-serif}button{font:inherit}header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#121216;border-bottom:1px solid #292930}.brand{font-size:21px;font-weight:850;letter-spacing:-.06em}.brand span{color:var(--accent)}#connection{display:flex;align-items:center;gap:6px;color:var(--good);font-size:10px;font-weight:750}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.viewport{height:414px;overflow:hidden;touch-action:pan-y}.track{display:flex;height:100%;transition:transform .24s cubic-bezier(.2,.8,.2,1)}.panel{width:360px;min-width:360px;padding:18px;overflow:auto}.panel-title{margin:0 0 14px;font-size:19px;letter-spacing:-.035em}.empty{display:grid;place-items:center;min-height:250px;padding:24px;text-align:center;color:var(--muted);line-height:1.55;border:1px dashed var(--line);border-radius:9px}.loading-placeholder{min-height:250px;border:1px solid #292932;border-radius:9px;background:linear-gradient(100deg,var(--surface) 25%,var(--surface2) 42%,var(--surface) 59%);background-size:250% 100%;animation:loading 1.2s ease-in-out infinite}.work-card{display:grid;grid-template-columns:104px 1fr;gap:15px;padding:13px;border:1px solid #292932;border-radius:10px;background:var(--surface)}.cover{width:104px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:var(--surface2)}.cover-placeholder{display:grid;place-items:center;color:var(--muted);font-size:10px;text-align:center}.work-copy{min-width:0;display:flex;flex-direction:column}.type{color:var(--accent);font-size:9px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.work-copy h2{margin:6px 0 8px;font-size:17px;line-height:1.15}.datum{margin:3px 0;color:var(--muted);font-size:11px}.datum strong{color:var(--text)}.detail-link{margin-top:auto;color:var(--accent);font-size:11px;font-weight:800}.page-state{display:flex;gap:7px;align-items:center;margin-top:12px;color:var(--muted);font-size:11px}.page-state.known{color:var(--good)}.list{display:grid;gap:9px}.list-item{display:grid;grid-template-columns:54px 1fr;gap:11px;padding:8px;border:1px solid #292932;border-radius:8px;background:var(--surface);color:inherit;text-decoration:none}.list-item img,.mini-cover{width:54px;height:78px;object-fit:cover;border-radius:4px;background:var(--surface2)}.list-copy{min-width:0;padding:3px 0}.list-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.list-copy small{display:block;margin-top:7px;color:var(--muted);font-size:10px}.setting{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px;border:1px solid #292932;border-radius:9px;background:var(--surface)}.setting strong{display:block}.setting small{display:block;margin-top:5px;color:var(--muted);line-height:1.4}.switch{position:relative;width:42px;height:24px;flex:none;border:0;border-radius:20px;background:#3a3a44}.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#ddd;transition:.18s}.switch[aria-checked="true"]{background:var(--accent)}.switch[aria-checked="true"]::after{left:21px;background:#211500}.pairing{margin-top:14px;padding:15px;border:1px solid #59431c;border-radius:9px;background:#211a0d}.pairing p{margin:0 0 10px;color:var(--muted);font-size:11px}.pair{width:100%;padding:10px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#211500;font-weight:850}.code{margin:8px 0;color:var(--accent);font-size:25px;font-weight:850;letter-spacing:.16em}.error{color:var(--danger)}.bottom-nav{height:64px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #292930;background:#121216}.tab{display:grid;place-content:center;justify-items:center;gap:3px;border:0;background:transparent;color:var(--muted);font-size:9px;font-weight:750}.tab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}.tab.active{color:var(--accent)}@keyframes loading{to{background-position-x:-250%}}@media(prefers-reduced-motion:reduce){.loading-placeholder{animation:none}}
  </style>
  <style>.loading-state{position:relative;min-height:250px}.loading-state .loading-placeholder{position:absolute;inset:0}.loading-state p{position:absolute;z-index:1;left:22px;right:22px;bottom:20px;margin:0;padding:10px;border-radius:6px;background:#0b0b0ed9;color:var(--text);text-align:center;font-size:11px;line-height:1.45}.sync-note{margin:0;padding:9px 10px;border:1px solid #59431c;border-radius:7px;background:#211a0d;color:var(--muted);font-size:10px;line-height:1.4}</style>
</head>
<body>
  <header><div class="brand">Fav<span>Lib</span></div><span id="connection"><i class="dot"></i><span>Automatique</span></span></header>
  <div class="viewport" id="viewport"><main class="track" id="track">
    <section class="panel" aria-labelledby="page-title"><h1 class="panel-title" id="page-title">Cette page</h1><div id="page-content" class="loading-placeholder" role="status" aria-label="Chargement"></div></section>
    <section class="panel" aria-labelledby="list-title"><h1 class="panel-title" id="list-title">Ma liste</h1><div id="continue-list" class="list"><div class="loading-placeholder" role="status" aria-label="Chargement"></div></div></section>
    <section class="panel" aria-labelledby="settings-title"><h1 class="panel-title" id="settings-title">Réglages</h1><div class="setting"><span><strong>Favori automatique</strong><small>Autoriser les mises à jour automatiques proposées.</small></span><button id="auto-favorite" class="switch" role="switch" aria-checked="false" aria-label="Favori automatique"></button></div><div id="pairing" class="pairing" hidden></div></section>
  </main></div>
  <nav class="bottom-nav" aria-label="Navigation du popup">
    <button class="tab active" data-panel="0" aria-current="page"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM15 3v5h4M8 13h8M8 17h6"/></svg><span>Page</span></button>
    <button class="tab" data-panel="1"><svg viewBox="0 0 24 24"><path d="M5 5h14v16H5zM8 3h8v4H8zM8 11h8M8 15h8"/></svg><span>Liste</span></button>
    <button class="tab" data-panel="2"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A7 7 0 0 0 15 6l-.3-2.6h-4L10.4 6A7 7 0 0 0 8.8 7L6.5 6.1l-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1A7 7 0 0 0 10.4 18l.3 2.6h4L15 18a7 7 0 0 0 1.6-1.1l2.4 1 2-3.4-2.1-1.5a7 7 0 0 0 .1-1z"/></svg><span>Réglages</span></button>
  </nav><script type="module" src="/src/popup.ts"></script>
</body></html>
