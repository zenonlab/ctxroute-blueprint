<!doctype html><html><body><main><h1>Appairage FavLib</h1><p>FavLib lit uniquement les favoris média après votre accord. Aucun mot de passe ni session Web n’est stocké dans l’extension.</p><label><input id="permission" type="checkbox"> J’autorise l’accès local aux favoris pour les importer</label><label><input id="auto" type="checkbox"> Mettre à jour automatiquement mes favoris (optionnelle)</label><p>Révoquez l’appareil depuis FavLib → Réglages. La file locale est conservée si le serveur est hors ligne.</p></main><script type="module">(async()=>{const state=async()=>{const r=await chrome.storage.local.get('favlibState');return r.favlibState};document.querySelector('#permission').addEventListener('change',async(e)=>{if(e.target.checked) await chrome.permissions.request({permissions:['bookmarks']});});const s=await state();const auto=document.querySelector('#auto');auto.checked=Boolean(s?.autoUpdateFavorites);auto.addEventListener('change',async()=>{const r=await state();await chrome.storage.local.set({favlibState:{...r,autoUpdateFavorites:auto.checked}})});})();</script></body></html>
