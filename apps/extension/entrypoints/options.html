<!doctype html><html><body><main><h1>Appairage FavLib</h1><p>FavLib lit uniquement les favoris média après votre accord. Aucun mot de passe ni session Web n’est stocké dans l’extension.</p><label><input id="permission" type="checkbox"> J’autorise l’accès local aux favoris pour les importer</label><p>Révoquez l’appareil depuis FavLib → Réglages. La file locale est conservée si le serveur est hors ligne.</p></main><script>document.querySelector('#permission').addEventListener('change', async (e)=>{if(e.target.checked) await chrome.permissions.request({permissions:['bookmarks']});});</script></body></html>
